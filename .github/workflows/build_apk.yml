name: 9DILI EXPRESS Release APK & In-App OTA Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Validate Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Verify Package & Extract Pubspec Version
        id: version
        run: |
          echo "Verifying package name..."
          grep -q 'namespace = "com.ghdinteractivestudio.dili_express"' android/app/build.gradle.kts || { echo "ERROR: Invalid namespace in build.gradle.kts!"; exit 1; }
          grep -q 'applicationId = "com.ghdinteractivestudio.dili_express"' android/app/build.gradle.kts || { echo "ERROR: Invalid applicationId in build.gradle.kts!"; exit 1; }

          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1 | tr -d ' ')
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d'+' -f2 | tr -d ' ')
          echo "PUBSPEC_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Building 9DILI EXPRESS v$VERSION_NAME (build $VERSION_CODE)"

      - name: Ensure Google Services & Keystore
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json is missing!"
            exit 1
          fi
          if [ -f "android/app/dili_express.keystore" ]; then
            echo "✓ Official 9DILI EXPRESS permanent release keystore is present."
            ls -l android/app/dili_express.keystore
          else
            echo "WARNING: android/app/dili_express.keystore not found, falling back to debug config."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ env.PUBSPEC_VERSION_NAME }}" \
            --build-number="${{ env.PUBSPEC_VERSION_CODE }}"

      - name: Locate AAPT & Verify APK Badging
        run: |
          AAPT_BIN=$(which aapt 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1 || echo "")
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
            echo "Using AAPT at: $AAPT_BIN"
            "$AAPT_BIN" dump badging "$APK_PATH" | grep -E "package: name=|versionCode=|versionName="
          else
            echo "aapt not found, verifying APK file directly."
          fi
          ls -la "$APK_PATH"

      - name: Verify APK Signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          echo "Verifying APK signature..."
          APK_FINGERPRINT=$(keytool -printcert -jarfile "$APK_PATH" 2>/dev/null | grep "SHA1:" | awk '{print $2}' || echo "")
          echo "APK Signature SHA1: $APK_FINGERPRINT"
          if [ -f "android/app/dili_express.keystore" ]; then
            KEYSTORE_FINGERPRINT=$(keytool -list -v -keystore android/app/dili_express.keystore -storepass dili2026express -alias dili_express 2>/dev/null | grep "SHA1:" | awk '{print $2}' || echo "")
            echo "Keystore      SHA1: $KEYSTORE_FINGERPRINT"
            if [ -n "$APK_FINGERPRINT" ] && [ "$APK_FINGERPRINT" = "$KEYSTORE_FINGERPRINT" ]; then
              echo "✓ APK signature matches official dili_express.keystore."
            fi
          fi

      - name: Package Release Artifacts & Generate SHA-256
        run: |
          cd build/app/outputs/flutter-apk/
          cp app-release.apk "dili_express-v${{ env.PUBSPEC_VERSION_NAME }}.apk"
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum "dili_express-v${{ env.PUBSPEC_VERSION_NAME }}.apk" >> app-release.apk.sha256
          RELEASE_HASH=$(head -n 1 app-release.apk.sha256 | awk '{print $1}')
          APK_SIZE=$(ls -lh app-release.apk | awk '{print $5}')
          echo "RELEASE_HASH=$RELEASE_HASH" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          cat app-release.apk.sha256

      - name: Generate Release Notes
        run: |
          cat << EOF > RELEASE_NOTES_v${{ env.PUBSPEC_VERSION_NAME }}.md
          ## 9DILI EXPRESS v${{ env.PUBSPEC_VERSION_NAME }} — Release Production

          ### Nouveautés & Déploiements
          - **Application Mobile Flutter** : Package officiel \`com.ghdinteractivestudio.dili_express\` signé avec certificat permanent.
          - **Radar Intelligent & Suivi GPS** : Intégration du rayon dynamique 2 à 10 km et attribution atomique sécurisée.
          - **Catalogue & Marqueurs 3D** : Marqueurs cartographiques Stitch et catalogue complet Algérie.
          - **Ordonnancement Cloudflare** : Notifications asynchrones Cloudflare Queues et Cloudflare Workers.

          ### Intégrité & Empreinte Numérique
          - **Taille de l'APK** : ${{ env.APK_SIZE }}
          - **SHA-256** : \`${{ env.RELEASE_HASH }}\`
          EOF

      - name: Upload APK Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dili-express-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/dili_express-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ env.PUBSPEC_VERSION_NAME }}
          name: 9DILI EXPRESS v${{ env.PUBSPEC_VERSION_NAME }}
          body_path: RELEASE_NOTES_v${{ env.PUBSPEC_VERSION_NAME }}.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/dili_express-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
